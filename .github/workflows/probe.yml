# A probe, not a gate. Run it by hand from the Actions tab.
#
# Every `gates` run since 2026-09-06 — 129 of them — failed in about two seconds with
# `runner_id: 0`, no steps and no logs. This job, which uses no actions at all and does nothing
# but echo, failed identically. That rules out the tests, the workflow and the repository's
# actions policy: GitHub is not assigning a runner.
#
# What is left is the account: Actions disabled for the repository or the owner, the spending
# limit reached, or the included minutes exhausted (a private repository bills minutes; a public
# one does not). None of it is fixable from a commit.
#
# After changing that, press "Run workflow" here. One green run means `gates` will work too.
name: probe

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "a runner picked this up"
          node --version
          git --version

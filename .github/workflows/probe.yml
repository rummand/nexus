# A probe, not a gate.
#
# Every `gates` run since the workflow was created has failed in about two seconds with no
# runner assigned and no logs, which means the jobs never started. That rules out the tests and
# leaves three candidates: Actions is off or out of minutes for the account, the runner label is
# unavailable, or the repository's actions policy forbids the `uses:` steps that `gates` depends
# on (checkout, setup-node, upload-artifact).
#
# This job uses no actions at all. If it runs, the policy is the cause and `gates` can be
# rewritten without `uses:`. If it fails the same way, the cause is the account and only the
# owner can clear it.
name: probe

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "a runner picked this up"
          node --version
          git --version
